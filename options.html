<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Word Definition Tool — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 420px;
      margin: 40px auto;
      color: #1a1a1a;
    }
    h1 {
      font-size: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #444;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 14px;
      border: none;
      background: #1a56db;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1443ad;
    }
    #status {
      margin-left: 10px;
      font-size: 13px;
      color: #1a7d3c;
    }
    p.help {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>AI Word Definition Tool — Settings</h1>
  <label for="apiKey">Claude API key</label>
  <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
  <p class="help">
    Stored locally in this browser only (chrome.storage.local) — never sent anywhere except
    directly to api.anthropic.com. Get a key at
    <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
  </p>
  <button id="save">Save</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
